services:
  postgres:
    image: postgres:16
    container_name: naeos-postgres
    environment:
      POSTGRES_USER: naeos
      POSTGRES_PASSWORD: naeos
      POSTGRES_DB: naeos_intelligence_dev
    ports:
      - "${INTELLIGENCE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - naeos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naeos -d naeos_intelligence_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-bootstrap:
    image: postgres:16
    container_name: naeos-intelligence-db-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: naeos
      PGPASSWORD: naeos
      PGDATABASE: naeos_intelligence_dev
    volumes:
      - ./docker/postgres/bootstrap.sql:/bootstrap.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql -v ON_ERROR_STOP=1 -f /bootstrap.sql"]
    restart: "no"

  naeos-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naeos-intelligence
    depends_on:
      naeos-intelligence-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://naeos_intelligence_runtime_login:naeos-runtime-dev@postgres:5432/naeos_intelligence_dev?sslmode=disable
      NAEOS_INTELLIGENCE_HTTP_ADDR: 0.0.0.0:8080
      NAEOS_INTELLIGENCE_APP_ENVIRONMENT: development
      NAEOS_INTELLIGENCE_APP_LOG_LEVEL: debug
      NAEOS_INTELLIGENCE_RATE_LIMIT_RATE: 10
      NAEOS_INTELLIGENCE_RATE_LIMIT_BURST: 20
      NAEOS_INTELLIGENCE_OPENAPI_SPEC_PATH: /app/api/openapi.yaml
      NAEOS_INTELLIGENCE_CORE_API_BASE_URL: ${NAEOS_INTELLIGENCE_CORE_API_BASE_URL:-https://api.naeos.dev/api}
      NAEOS_CORE_SERVICE_TOKEN: ${NAEOS_CORE_SERVICE_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app/api:ro
    restart: unless-stopped

  naeos-intelligence-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naeos-intelligence-migrate
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      MIGRATOR_DATABASE_URL: postgres://naeos_intelligence_migrator_login:naeos-migrator-dev@postgres:5432/naeos_intelligence_dev?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    entrypoint: ["/bin/naeos-intelligence-migrate"]
    volumes:
      - ./migrations:/app/migrations:ro
    restart: "no"

volumes:
  naeos-postgres-data:
