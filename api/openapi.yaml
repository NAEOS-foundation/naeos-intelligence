openapi: 3.1.0
info:
  title: NAEOS Intelligence API
  version: 0.1.0
  description: Initial asynchronous API. Accepted submission does not imply execution authorization.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Minimal public health endpoint
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: healthy }
  /ready:
    get:
      operationId: getReady
      summary: Readiness endpoint; reports store connectivity
      security: []
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ready }
        "503":
          $ref: "#/components/responses/Problem"
          description: SERVICE_UNAVAILABLE — store is not reachable
  /intelligence/requests:
    post:
      operationId: submitIntelligenceRequest
      summary: Submit request
      security:
        - bearerAuth: [intelligence:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestCorrelation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "202":
          description: Accepted; no execution or completion is implied
          headers:
            Location: { schema: { type: string } }
            Idempotency-Replayed: { schema: { type: string, enum: ["true"] } }
            X-Request-ID: { $ref: "#/components/headers/RequestCorrelation" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "400":
          $ref: "#/components/responses/Problem"
          description: INVALID_REQUEST — malformed JSON, unknown fields, or invalid idempotency key
        "401":
          $ref: "#/components/responses/Problem"
          description: UNAUTHENTICATED — missing or invalid credentials
        "403":
          $ref: "#/components/responses/Problem"
          description: FORBIDDEN — authenticated client lacks the required scope
        "409":
          $ref: "#/components/responses/Problem"
          description: CONFLICT — idempotency key conflicts with a different request payload
        "413":
          $ref: "#/components/responses/Problem"
          description: PAYLOAD_TOO_LARGE — request body exceeds the configured limit
        "422":
          $ref: "#/components/responses/Problem"
          description: UNPROCESSABLE_REQUEST — request violates semantic validation or policy constraints
        "503":
          $ref: "#/components/responses/Problem"
          description: SERVICE_UNAVAILABLE — authentication verifier is not configured; protected requests fail closed
  /intelligence/requests/{request_id}:
    parameters:
      - $ref: "#/components/parameters/RequestIDPath"
    get:
      operationId: getIntelligenceRequest
      summary: Retrieve request for owning client
      security:
        - bearerAuth: [intelligence:read]
      responses:
        "200":
          description: Current request representation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401":
          $ref: "#/components/responses/Problem"
          description: UNAUTHENTICATED — missing or invalid credentials
        "403":
          $ref: "#/components/responses/Problem"
          description: FORBIDDEN — authenticated client lacks the required scope
        "404":
          $ref: "#/components/responses/Problem"
          description: RESOURCE_NOT_FOUND — request does not exist or is not accessible to the client
        "503":
          $ref: "#/components/responses/Problem"
          description: SERVICE_UNAVAILABLE — authentication verifier is not configured; protected requests fail closed
  /intelligence/requests/{request_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RequestIDPath"
    post:
      operationId: cancelIntelligenceRequest
      summary: Request cancellation while request state permits
      security:
        - bearerAuth: [intelligence:write]
      parameters:
        - $ref: "#/components/parameters/RequestCorrelation"
      responses:
        "202":
          description: Cancellation accepted or request already cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancellationAccepted" }
        "401":
          $ref: "#/components/responses/Problem"
          description: UNAUTHENTICATED — missing or invalid credentials
        "403":
          $ref: "#/components/responses/Problem"
          description: FORBIDDEN — authenticated client lacks the required scope
        "404":
          $ref: "#/components/responses/Problem"
          description: RESOURCE_NOT_FOUND — request does not exist or is not accessible to the client
        "409":
          $ref: "#/components/responses/Problem"
          description: CONFLICT — request is not cancellable in its current lifecycle state
        "503":
          $ref: "#/components/responses/Problem"
          description: SERVICE_UNAVAILABLE — authentication verifier is not configured; protected requests fail closed
  /intelligence/requests/{request_id}/approval:
    parameters:
      - $ref: "#/components/parameters/RequestIDPath"
    post:
      operationId: recordApprovalDecision
      summary: Record an approval decision for a request
      security:
        - bearerAuth: [intelligence:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionInput"
      responses:
        "200":
          description: Approval decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalDecisionResponse" }
        "401":
          $ref: "#/components/responses/Problem"
          description: UNAUTHENTICATED — missing or invalid credentials
        "403":
          $ref: "#/components/responses/Problem"
          description: FORBIDDEN — authenticated client lacks the required scope
        "404":
          $ref: "#/components/responses/Problem"
          description: RESOURCE_NOT_FOUND — request does not exist or is not accessible to the client
        "503":
          $ref: "#/components/responses/Problem"
          description: SERVICE_UNAVAILABLE — authentication verifier is not configured; protected requests fail closed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255 }
    RequestCorrelation:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    RequestIDPath:
      name: request_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  headers:
    RequestCorrelation:
      description: Correlation identifier for this request
      schema: { type: string, maxLength: 128 }
  responses:
    Problem:
      description: Safe machine-readable error envelope
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestCorrelation"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    RequestInput:
      type: object
      additionalProperties: false
      required: [purpose, execution_mode]
      properties:
        purpose: { type: string, minLength: 1, maxLength: 2000 }
        context_sources:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [type, reference]
            properties:
              type: { type: string, minLength: 1, maxLength: 64 }
              reference: { type: string, minLength: 1, maxLength: 1024 }
        execution_mode: { type: string, const: analysis_only }
        desired_outputs:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 128 }
        metadata:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 256 }
    Accepted:
      type: object
      additionalProperties: false
      required: [request_id, status, approval_required, created_at, status_url]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        status: { $ref: "#/components/schemas/Status" }
        approval_required: { type: boolean }
        created_at: { type: string, format: date-time }
        status_url: { type: string, format: uri-reference }
    Request:
      type: object
      additionalProperties: false
      required: [request_id, status, purpose, execution_mode, created_at, updated_at]
      properties:
        request_id: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        purpose: { type: string }
        execution_mode: { type: string, const: analysis_only }
        approval_required: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CancellationAccepted:
      type: object
      additionalProperties: false
      required: [request_id, status, message]
      properties:
        request_id: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        message: { type: string, maxLength: 1000 }
    ApprovalDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, denied, rejected] }
        approved_by: { type: string, maxLength: 256 }
        reason: { type: string, maxLength: 1000 }
    ApprovalDecisionResponse:
      type: object
      additionalProperties: false
      required: [request_id, action, execution_mode, decision, approval_required, created_at]
      properties:
        request_id: { type: string }
        action: { type: string }
        execution_mode: { type: string }
        decision: { type: string }
        approved_by: { type: string, maxLength: 256 }
        reason: { type: string, maxLength: 1000 }
        approval_required: { type: boolean }
        created_at: { type: string, format: date-time }
    Status:
      type: string
      enum: [accepted, queued, running, completed, failed, cancelled, requires_approval]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }
