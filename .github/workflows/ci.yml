name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naeos
          POSTGRES_PASSWORD: naeos
          POSTGRES_DB: naeos_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naeos -d naeos_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://naeos:naeos@localhost:5432/naeos_intelligence_test?sslmode=disable
      NAEOS_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Verify formatting
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          printf '%s\n' "$files"
          test -z "$files"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
