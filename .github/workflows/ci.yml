name: CI

on:
  pull_request:
  push:
    branches: [main, feat/*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naeos
          POSTGRES_PASSWORD: naeos
          POSTGRES_DB: naeos_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naeos -d naeos_intelligence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://naeos:naeos@localhost:5432/naeos_intelligence_test?sslmode=disable
      NAEOS_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Runner preflight diagnostics
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## CI runner preflight"
            echo
            echo "- Run ID: ${GITHUB_RUN_ID}"
            echo "- Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner OS: ${RUNNER_OS}"
            echo "- Runner architecture: ${RUNNER_ARCH}"
            echo
            echo "```text"
            uname -a
            cat /etc/os-release
            git --version
            df -h .
            free -h
            echo "```"
          } >> "${GITHUB_STEP_SUMMARY}"
          uname -a
          cat /etc/os-release
          git --version
          df -h .
          free -h
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve and verify module sums
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Upload verified go.sum for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-go-sum
          path: go.sum
          if-no-files-found: error
      - name: Download modules
        run: go mod download
      - name: Install govulncheck
        # Pin the scanner module version to keep CI tool installation reproducible.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan Go code for known vulnerabilities
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Scan for secrets
        run: |
          set -e
          if grep -rnEi '(sk_live|sk_test|pk_live|pk_test|ghp_|github_pat_|AKIA[0-9A-Z]{16}|[0-9a-zA-Z/+]{40}=|password|secret|api.key|api.token|access.token)' --include='*.go' --include='*.yaml' --include='*.yml' --include='*.md' --exclude='*_test.go' --exclude-dir=.git . | grep -viE '(TODO|FIXME|example|placeholder|do-not-leak|fake|test-|mock)' ; then
            echo "Potential secrets detected"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
